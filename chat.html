<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tagalog Work Study Hub - Chat Channel</title>
    <style>
        :root {
            --bg-slate: #0f172a;
            --card-bg: #1e293b;
            --accent-blue: #0ea5e9;
            --success-green: #10b981;
            --text-light: #f8fafc;
            --text-muted: #94a3b8;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-slate);
            color: var(--text-light);
            margin: 0;
            padding: 20px;
        }

        .chat-container {
            max-width: 900px;
            margin: 0 auto;
        }

        .header-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: var(--card-bg);
            padding: 15px 25px;
            border-radius: 10px;
            border: 1px solid #334155;
            margin-bottom: 20px;
        }

        .header-title {
            margin: 0;
            font-size: 1.4em;
            color: white;
        }

        .btn-back {
            background: #334155;
            color: var(--text-light);
            text-decoration: none;
            padding: 8px 16px;
            border-radius: 6px;
            font-weight: 600;
            font-size: 0.9em;
            border: 1px solid #475569;
        }

        .btn-back:hover {
            background: #475569;
        }

        .hub-workspace {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            margin-bottom: 20px;
        }

        .profile-card {
            background: var(--card-bg);
            border-radius: 12px;
            border: 1px solid #334155;
            padding: 15px;
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .display-avatar {
            width: 65px;
            height: 65px;
            border-radius: 50%;
            object-fit: cover;
            border: 2px solid #475569;
            background: #111827;
        }

        .profile-card.active-michael .display-avatar { border-color: var(--success-green); }
        .profile-card.active-mary .display-avatar { border-color: var(--accent-blue); }

        .card-details h3 { margin: 0 0 4px 0; font-size: 1.1em; color: white; }
        .card-details p { margin: 0; font-size: 0.85em; color: var(--text-muted); }

        .card {
            background: var(--card-bg);
            border-radius: 10px;
            padding: 24px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
            border: 1px solid #334155;
        }

        .chat-box {
            background: #0b0f19;
            border-radius: 10px;
            border: 1px solid #334155;
            height: 400px;
            overflow-y: auto;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        /* Message Row and Axis Alignment Rules */
        .message-row {
            display: flex;
            gap: 12px;
            width: 100%;
            align-items: flex-start;
            box-sizing: border-box;
        }

        .message-row.mary-row {
            justify-content: flex-start;
        }

        .message-row.michael-row {
            justify-content: flex-end;
        }

        .chat-avatar {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            object-fit: cover;
            flex-shrink: 0;
        }

        .mary-row .chat-avatar { border: 2px solid var(--accent-blue); }
        .michael-row .chat-avatar { border: 2px solid var(--success-green); }

        .message-content-wrapper {
            display: flex;
            flex-direction: column;
            max-width: 70%;
        }

        .mary-row .message-content-wrapper {
            align-items: flex-start;
        }

        .michael-row .message-content-wrapper {
            align-items: flex-end;
        }

        .message-bubble {
            padding: 12px 16px;
            border-radius: 8px;
            line-height: 1.45;
            font-size: 0.95em;
            color: #ffffff;
            word-break: break-word;
        }

        .mary-row .message-bubble {
            background: #1e293b;
            border-left: 4px solid var(--accent-blue);
        }

        .michael-row .message-bubble {
            background: #0284c7;
            border-right: 4px solid var(--success-green);
        }

        .msg-sender {
            display: block;
            font-weight: bold;
            font-size: 0.85em;
            margin-bottom: 4px;
        }

        .mary-row .msg-sender { color: var(--accent-blue); }
        .michael-row .msg-sender { color: #67e8f9; }
        .msg-meta { font-size: 0.75em; color: rgba(255, 255, 255, 0.4); margin-top: 6px; display: block; }

        .chat-input-area { display: flex; gap: 12px; margin-top: 20px; }
        .chat-input { flex: 1; background: #111827; border: 1px solid #475569; border-radius: 6px; padding: 14px; color: white; font-size: 1em; }
        .chat-input:focus { outline: none; border-color: var(--accent-blue); }
        .btn-send { background: var(--accent-blue); color: white; border: none; padding: 0 24px; border-radius: 6px; font-weight: 600; cursor: pointer; }
        .btn-send:hover { background: #0284c7; }
    </style>
</head>
<body>

    <div class="chat-container">
        <header class="header-bar">
            <h1 class="header-title">Tagalog Work Study Hub — Chat</h1>
            <a href="michael_dashboard.html" class="btn-back">← Back to Dashboard</a>
        </header>

        <section class="hub-workspace">
            <div class="profile-card active-michael">
                <img src="images/profile_michael.png" alt="Michael Proctor" class="display-avatar">
                <div class="card-details">
                    <h3>Tay Michael's Homework</h3>
                    <p><strong>Lesson Study:</strong> Affixes Review</p>
                </div>
            </div>
            <div class="profile-card active-mary">
                <img src="images/profile_mary.png" alt="Guro Mary" class="display-avatar">
                <div class="card-details">
                    <h3>Guro Mary's Workspace</h3>
                    <p><strong>Study Profile:</strong> Language Core</p>
                </div>
            </div>
        </section>

        <div class="card">
            <h2 style="font-size: 1.1em; margin-top:0; margin-bottom: 15px; border-bottom: 1px solid #334155; padding-bottom: 10px;">Direct Conversation Log</h2>
            
            <div class="chat-box" id="chatThread">
                <div class="message-row mary-row">
                    <img src="images/profile_mary.png" alt="Mary" class="chat-avatar">
                    <div class="message-content-wrapper">
                        <div class="message-bubble">
                            <span class="msg-sender">Guro Mary</span>
                            Drafted the responses for the layout review. Let me know if the affixes make sense!
                            <span class="msg-meta">Saturday</span>
                        </div>
                    </div>
                </div>
            </div>

            <div class="chat-input-area">
                <input type="text" id="messageInput" class="chat-input" placeholder="Type a message to send to Mary...">
                <button class="btn-send" onclick="sendMessage()">Send Msg</button>
            </div>
        </div>
    </div>

    <script>
        function sendMessage() {
            const input = document.getElementById('messageInput');
            const thread = document.getElementById('chatThread');
            
            if(input.value.trim() !== "") {
                const text = input.value;
                const rowDiv = document.createElement('div');
                rowDiv.className = 'message-row michael-row';
                
                rowDiv.innerHTML = `
                    <div class="message-content-wrapper">
                        <div class="message-bubble">
                            <span class="msg-sender">Michael</span>
                            ${escapeHTML(text)}
                            <span class="msg-meta">Just Now</span>
                        </div>
                    </div>
                    <img src="images/profile_michael.png" alt="Michael" class="chat-avatar">
                `;
                
                thread.appendChild(rowDiv);
                thread.scrollTop = thread.scrollHeight;
                
                localStorage.setItem('michael_msg_trigger', JSON.stringify({
                    text: text,
                    timestamp: Date.now()
                }));
                
                input.value = "";
            }
        }

        window.addEventListener('storage', function(e) {
            if (e.key === 'mary_msg_trigger' && e.newValue) {
                const data = JSON.parse(e.newValue);
                alert("Mary sent a message");

                const thread = document.getElementById('chatThread');
                const rowDiv = document.createElement('div');
                rowDiv.className = 'message-row mary-row';
                rowDiv.innerHTML = `
                    <img src="images/profile_mary.png" alt="Mary" class="chat-avatar">
                    <div class="message-content-wrapper">
                        <div class="message-bubble">
                            <span class="msg-sender">Guro Mary</span>
                            ${escapeHTML(data.text)}
                            <span class="msg-meta">Just Now</span>
                        </div>
                    </div>
                `;
                thread.appendChild(rowDiv);
                thread.scrollTop = thread.scrollHeight;
            }
        });

        function escapeHTML(str) {
            return str.replace(/[&<>'"]/g, tag => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' }[tag] || tag));
        }

        document.getElementById('messageInput').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') sendMessage();
        });
    </script>
</body>
</html>
