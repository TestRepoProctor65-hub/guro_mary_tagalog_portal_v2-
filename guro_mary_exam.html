<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Guro Mary - Official Synchronized Examination</title>
    <style>
        :root {
            --bg-slate: #0f172a;
            --card-bg: #1e293b;
            --accent-blue: #0ea5e9;
            --success-green: #10b981;
            --danger-red: #f43f5e;
            --text-light: #f8fafc;
            --text-muted: #94a3b8;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-slate);
            color: var(--text-light);
            margin: 0;
            padding: 20px;
        }

        .exam-container {
            max-width: 1100px;
            margin: 0 auto;
        }

        .header-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: var(--card-bg);
            padding: 15px 25px;
            border-radius: 10px;
            border: 1px solid #334155;
            margin-bottom: 20px;
        }

        /* Glowing System Timer Countdown Element */
        .timer-badge {
            background-color: rgba(244, 63, 94, 0.15);
            color: var(--danger-red);
            border: 2px solid var(--danger-red);
            padding: 10px 20px;
            border-radius: 8px;
            font-size: 1.3em;
            font-weight: bold;
            font-family: monospace;
            letter-spacing: 1px;
            box-shadow: 0 0 10px rgba(244, 63, 94, 0.2);
        }

        .split-layout {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }

        @media (max-width: 768px) {
            .split-layout { grid-template-columns: 1fr; }
        }

        .card {
            background: var(--card-bg);
            border-radius: 10px;
            padding: 24px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
            border: 1px solid #334155;
            box-sizing: border-box;
        }

        .reading-box {
            background: #111827;
            border-radius: 8px;
            padding: 20px;
            line-height: 1.7;
            font-size: 1.05em;
            color: #e2e8f0;
            border-left: 4px solid var(--accent-blue);
            white-space: pre-wrap;
        }

        .options-grid { display: grid; grid-template-columns: 1fr; gap: 12px; margin-top: 20px; }
        
        .option-btn {
            background: #111827;
            border: 1px solid #475569;
            color: var(--text-light);
            padding: 14px 18px;
            border-radius: 8px;
            text-align: left;
            font-size: 0.95em;
            cursor: pointer;
            transition: all 0.2s ease;
            font-family: inherit;
        }
        .option-btn:hover { border-color: var(--accent-blue); background: rgba(14, 165, 233, 0.05); }

        .btn {
            background-color: var(--success-green);
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 6px;
            font-weight: 600;
            cursor: pointer;
            width: 100%;
            margin-top: 20px;
            font-size: 1em;
        }
        .btn:hover { background-color: #059669; }
    </style>
</head>
<body>

    <div class="exam-container">
        <!-- Top Status Parameter Layout Grid Component Header -->
        <header class="header-bar">
            <div>
                <h1 style="margin: 0; font-size: 1.3em; color: white;">📝 Guro Mary Official Timed Examination</h1>
                <span style="color: var(--text-muted); font-size: 0.85em;">Student Profile Record: Michael Proctor</span>
            </div>
            <div class="timer-badge" id="examClockDisplay">00:00</div>
        </header>

        <div class="split-layout">
            <!-- Requirement (2): Reading Comprehension Context Document Box -->
            <div class="card">
                <h2 style="color: var(--accent-blue); font-size: 1.15em; margin-top:0;">📖 Section A: Reading Context Passage</h2>
                <div class="reading-box" id="passageDisplayField">Loading assigned curriculum context parameters...</div>
            </div>

            <!-- Requirement (3): Evaluation Question Form Panel Component Display Grid -->
            <div class="card" id="examResponseCard">
                <h2 style="color: var(--accent-blue); font-size: 1.15em; margin-top:0;">✏️ Section B: Evaluation Target Question</h2>
                <p class="question-text" id="questionDisplayField" style="font-size: 1.1em; line-height: 1.5; color: white;"></p>
                
                <div class="options-grid" id="examOptionsGrid">
                    <!-- Option buttons rendered contextually here -->
                </div>

                <button class="btn" id="finalExamSubmitBtn" onclick="submitFinishedExam()" style="display:none;">🔒 Turn In Official Examination</button>
            </div>
        </div>
    </div>

    <script>
        let examData = null;
        let selectedChoice = "";
        let countdownTimer = null;
        let totalSecondsRemaining = 0;

        function loadMaryExamContext() {
            examData = JSON.parse(localStorage.getItem('guro_mary_live_exam'));

            if (!examData) {
                document.body.innerHTML = `
                    <div style="text-align:center; padding: 100px 20px; font-family:sans-serif; color: var(--text-muted);">
                        <h2>No active examination parameters detected inside the portal framework.</h2>
                        <a href="michael_dashboard.html" style="color: var(--accent-blue); text-decoration:none; font-weight:bold;">← Return to Student Dashboard</a>
                    </div>`;
                return;
            }

            // Populate screen targets
            document.getElementById('passageDisplayField').innerHTML = examData.passage;
            document.getElementById('questionDisplayField').innerHTML = examData.question;

            // Generate interface options buttons
            const grid = document.getElementById('examOptionsGrid');
            grid.innerHTML = "";
            examData.options.forEach(opt => {
                const b = document.createElement('button');
                b.className = 'option-btn';
                b.textContent = opt;
                b.onclick = () => selectExamAnswer(b, opt);
                grid.appendChild(b);
            });

            // Turn on precise clock configurations
            totalSecondsRemaining = examData.durationMinutes * 60;
            startCountdownLoop();
        }

        function selectExamAnswer(element, val) {
            selectedChoice = val;
            const buttons = document.querySelectorAll('.option-btn');
            buttons.forEach(b => b.style.borderColor = "#475569"); // Reset colors
            element.style.borderColor = "var(--accent-blue)"; // Highlight selected option
            
            document.getElementById('finalExamSubmitBtn').style.display = 'block';
        }

        // Timer Interval Tracking Configuration Loop Engine
        function startCountdownLoop() {
            updateClockDisplay();
            countdownTimer = setInterval(() => {
                totalSecondsRemaining--;
                updateClockDisplay();

                if (totalSecondsRemaining <= 0) {
                    clearInterval(countdownTimer);
                    alert("⏰ TIME IS UP! The testing matrix window has concluded. Processing immediate automated turn-in sequence...");
                    submitFinishedExam(true); // Forced sub mode enabled
                }
            }, 1000);
        }

        function updateClockDisplay() {
            const mins = Math.floor(totalSecondsRemaining / 60);
            const secs = totalSecondsRemaining % 60;
            const formattedMins = mins < 10 ? '0' + mins : mins;
            const formattedSecs = secs < 10 ? '0' + secs : secs;
            
            const element = document.getElementById('examClockDisplay');
            element.textContent = `${formattedMins}:${formattedSecs}`;
            
            // Turn text completely red if less than 60 seconds remain
            if (totalSecondsRemaining < 60) {
                element.style.color = "var(--danger-red)";
                element.style.boxShadow = "0 0 15px rgba(244, 63, 94, 0.4)";
            }
        }

        function submitFinishedExam(forcedTimeout = false) {
            clearInterval(countdownTimer);

            let gradeResult = "Needs Evaluation";
            let correctionNotes = "";

            if (forcedTimeout && selectedChoice === "") {
                gradeResult = "F";
                correctionNotes = "Incomplete Exam submission due to system countdown expiration tracker limits.";
            } else {
                const isCorrect = (selectedChoice.toLowerCase() === examData.correctAnswer.toLowerCase());
                gradeResult = isCorrect ? "A+ (Excellent)" : "Needs Revision";
                correctionNotes = isCorrect 
                    ? `Michael successfully parsed the custom test rules perfectly! Answer selected: "${selectedChoice}".`
                    : `Incorrect translation match verified. Chosen answer: "${selectedChoice}", expected answer file pattern: "${examData.correctAnswer}".`;
            }

            // Route standard grading structures straight back to Mary's standard feedback stream cards
            localStorage.setItem('grade_broadcast_trigger', JSON.stringify({
                taskType: "Official Controlled Exam",
                grade: gradeResult,
                notes: correctionNotes,
                timestamp: Date.now()
            }));

            // Wipe specific exam token parameter files from layout allocation loops
            localStorage.removeItem('guro_mary_live_exam');

            // Render final success card window view
            const workspace = document.getElementById('examResponseCard');
            workspace.innerHTML = `
                <div style="text-align:center; padding: 40px 0;">
                    <h3 style="font-size:1.5em; color: var(--success-green); margin-top:0;">Exam Turned In! 🔒</h3>
                    <p style="color: var(--text-muted); font-size:0.95em; line-height:1.5; margin-bottom:25px;">
                        Your evaluation matrix answers have been securely logged and mapped straight to Guro Mary's teacher monitoring dashboard panels.
                    </p>
                    <a href="michael_dashboard.html" class="btn" style="text-decoration:none; display:inline-block; width:auto; padding: 12px 30px;">Return to Dashboard</a>
                </div>`;
        }

        function escapeHTML(str) {
            return str.replace(/[&<>'"]/g, tag => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' }[tag] || tag));
        }

        window.onload = loadMaryExamContext;
    </script>
</body>
</html>
